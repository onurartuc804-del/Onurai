<!DOCTYPE html><html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101114">
<title>Onur AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;height:100dvh;display:flex;flex-direction:column;background:#101114;color:#f5f5f7;font-family:Arial,sans-serif}
header{height:62px;flex-shrink:0;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid #292a30;font-size:21px;font-weight:700}
#messages{flex:1;min-height:0;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.message{max-width:850px;width:fit-content;padding:13px 15px;border-radius:16px;background:#202127;overflow-wrap:anywhere;line-height:1.55;white-space:pre-wrap}
.user{align-self:flex-end;background:#343640}
.assistant{align-self:flex-start}
.result{display:block;width:100%;max-width:600px;height:auto;border-radius:12px;margin-top:8px}
.download{display:inline-block;margin-top:12px;color:#b8caff;text-decoration:none}
.download:hover{text-decoration:underline}
#status{padding:0 18px 8px;min-height:8px;color:#bcbcc5;font-size:13px}
#createMenu{display:none;gap:10px;flex-wrap:wrap;padding:12px;background:#202127;border-top:1px solid #292a30}
form{display:flex;align-items:center;gap:9px;padding:12px;border-top:1px solid #292a30;background:#151619}
input{flex:1;min-width:0;padding:15px;border:1px solid #383941;border-radius:13px;background:#222329;color:white;font-size:16px;outline:none}
input:focus{border-color:#777dff}
button{min-height:46px;padding:0 17px;border:0;border-radius:13px;background:#777dff;color:white;font-size:14px;font-weight:bold;cursor:pointer;white-space:nowrap}
button:hover{filter:brightness(1.1)}
button:disabled{opacity:.55;cursor:wait}
.secondary{background:#292a35;border:1px solid #41424e}
@media(max-width:600px){
 form{flex-wrap:wrap}
 #prompt{flex:1 1 55%}
 #send{flex:0 0 auto}
 #messages{padding:14px}
 #createMenu button{flex:1 1 100%}
}
</style>
</head>
<body>
<header>Onur AI</header><main id="messages">
  <div class="message assistant">Merhaba! Ben Onur AI. Sana nasıl yardımcı olabilirim?</div>
</main><div id="status" aria-live="polite"></div><div id="createMenu">
  <button id="imageButton" class="secondary" type="button">🖼️ Görsel Oluştur</button>
  <button id="videoButton" class="secondary" type="button">🎬 Video Oluştur</button>
</div><form id="form">
  <button id="plusButton" class="secondary" type="button" aria-label="Oluşturma menüsünü aç">＋</button>
  <input id="prompt" placeholder="Mesajını yaz..." autocomplete="off" required>
  <button id="send" type="submit">Gönder</button>
</form><script>
const form = document.getElementById("form");
const input = document.getElementById("prompt");
const messages = document.getElementById("messages");
const statusBox = document.getElementById("status");
const send = document.getElementById("send");
const plusButton = document.getElementById("plusButton");
const imageButton = document.getElementById("imageButton");
const videoButton = document.getElementById("videoButton");
const createMenu = document.getElementById("createMenu");

let mode = "chat";

function scrollToBottom(){
  messages.scrollTop = messages.scrollHeight;
}

function addMessage(text, role = "assistant"){
  const element = document.createElement("div");
  element.className = "message " + role;
  element.textContent = text;
  messages.appendChild(element);
  scrollToBottom();
}

function addMedia(url, kind){
  const box = document.createElement("div");
  box.className = "message assistant";

  const title = document.createElement("div");
  title.textContent = kind === "image"
    ? "Oluşturulan görsel"
    : "Oluşturulan video";

  let media;

  if(kind === "image"){
    media = document.createElement("img");
    media.alt = "Onur AI tarafından oluşturulan görsel";
    media.src = url;
  }else{
    media = document.createElement("video");
    media.controls = true;
    media.playsInline = true;
    media.preload = "metadata";
    media.src = url;
  }

  media.className = "result";

  const link = document.createElement("a");
  link.className = "download";
  link.href = url;
  link.download = kind === "image" ? "onur-ai.png" : "onur-ai-video.mp4";
  link.textContent = kind === "image" ? "PNG olarak indir" : "MP4 olarak indir";

  box.append(title, media, link);
  messages.appendChild(box);
  scrollToBottom();
}

async function postJSON(url, body){
  const response = await fetch(url,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body)
  });

  if(!response.ok){
    let message = "İstek başarısız oldu.";
    try{
      const data = await response.json();
      message = data.error || message;
    }catch{}
    throw new Error(message);
  }

  return response;
}

async function requestMedia(url, prompt, expectedType){
  const response = await postJSON(url,{prompt});
  const blob = await response.blob();

  if(!blob.type.startsWith(expectedType)){
    throw new Error("Sunucu geçerli bir medya dosyası döndürmedi.");
  }

  return URL.createObjectURL(blob);
}

plusButton.addEventListener("click",()=>{
  createMenu.style.display =
    createMenu.style.display === "flex" ? "none" : "flex";
});

imageButton.addEventListener("click",()=>{
  mode = "image";
  input.value = "";
  input.placeholder = "Oluşturulacak görseli tarif et...";
  createMenu.style.display = "none";
  input.focus();
});

videoButton.addEventListener("click",()=>{
  mode = "video";
  input.value = "";
  input.placeholder = "Oluşturulacak videoyu tarif et...";
  createMenu.style.display = "none";
  input.focus();
});

input.addEventListener("input",()=>{
  if(/^@gorselolustur\b/i.test(input.value.trim())){
    mode = "image";
    input.placeholder = "Oluşturulacak görseli tarif et...";
  }else if(/^@video\b/i.test(input.value.trim())){
    mode = "video";
    input.placeholder = "Oluşturulacak videoyu tarif et...";
  }else if(!input.value.trim()){
    mode = "chat";
    input.placeholder = "Mesajını yaz...";
  }
});

form.addEventListener("submit",async event=>{
  event.preventDefault();

  const message = input.value.trim();
  if(!message) return;

  let selectedMode = mode;

  if(/^@gorselolustur\b/i.test(message)){
    selectedMode = "image";
  }else if(/^@video\b/i.test(message)){
    selectedMode = "video";
  }

  const prompt = message
    .replace(/^@gorselolustur\s*/i,"")
    .replace(/^@video\s*/i,"")
    .trim();

  if(!prompt){
    addMessage("Önce ne oluşturulacağını tarif et.");
    return;
  }

  addMessage(message,"user");

  input.value = "";
  input.disabled = true;
  send.disabled = true;
  plusButton.disabled = true;
  imageButton.disabled = true;
  videoButton.disabled = true;

  statusBox.textContent =
    selectedMode === "image" ? "Görsel oluşturuluyor..." :
    selectedMode === "video" ? "Video oluşturuluyor..." : "";

  try{
    if(selectedMode === "image"){
      const url = await requestMedia("/api/image",prompt,"image/");
      addMedia(url,"image");
    }else if(selectedMode === "video"){
      const url = await requestMedia("/api/video",prompt,"video/");
      addMedia(url,"video");
    }else{
      const response = await postJSON("/api/chat",{message:prompt});
      const data = await response.json();
      addMessage(data.reply || "Yanıt alınamadı.","assistant");
    }
  }catch(error){
    addMessage(error.message || "Bir hata oluştu.","assistant");
  }finally{
    input.disabled = false;
    send.disabled = false;
    plusButton.disabled = false;
    imageButton.disabled = false;
    videoButton.disabled = false;
    mode = "chat";
    input.placeholder = "Mesajını yaz...";
    statusBox.textContent = "";
    input.focus();
  }
});
</script></body>
</html>
