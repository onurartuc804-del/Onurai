<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101114">
<title>Onur AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;height:100dvh;display:flex;background:#101114;color:#f5f5f7;font-family:Arial,sans-serif;overflow:hidden}
button,input,textarea{font:inherit}
button{cursor:pointer}
#sidebar{width:270px;background:#191a1f;border-right:1px solid #303139;display:flex;flex-direction:column;padding:14px;gap:12px;flex-shrink:0}
.side-top{display:flex;align-items:center;justify-content:space-between}
.brand{font-size:20px;font-weight:bold}
#newChat{background:#292a31;border:1px solid #41424b;color:white;border-radius:10px;padding:12px;text-align:left}
#chatList{display:flex;flex-direction:column;gap:5px;overflow:auto}
.chat-item{display:flex;gap:5px;align-items:center}
.chat-select{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;background:transparent;color:#e9e9ef;border:0;border-radius:8px;padding:11px}
.chat-select.active,.chat-select:hover{background:#303139}
.delete-chat{background:transparent;border:0;color:#aaa;padding:8px;border-radius:8px}
.delete-chat:hover{background:#3a3032;color:white}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
header{height:62px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid #292a30}
#menuButton{background:transparent;border:0;color:white;font-size:24px;padding:5px}
#mobileTitle{font-weight:bold}
#messages{flex:1;overflow:auto;padding:24px 16px;display:flex;flex-direction:column;gap:18px}
.welcome{margin:auto;text-align:center;color:#d8d8df}
.welcome h1{font-size:28px}
.message{width:100%;max-width:800px;margin:0 auto;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.message.user{background:#292a31;border-radius:18px;padding:12px 16px;max-width:760px;width:fit-content;align-self:flex-end}
.message.assistant{align-self:center}
.composer-wrap{padding:12px 16px 20px}
#composer{position:relative;max-width:850px;margin:auto;background:#202127;border:1px solid #3b3c45;border-radius:22px;padding:10px;display:flex;align-items:flex-end;gap:8px}
#messageInput{flex:1;resize:none;max-height:180px;min-height:42px;min-width:0;background:transparent;border:0;outline:none;color:white;padding:11px}
#sendButton{flex-shrink:0;width:42px;height:42px;border:0;border-radius:50%;background:#f5f5f7;color:#111;font-size:20px}
#sendButton:disabled{opacity:.5;cursor:default}
#plusWrap{position:relative;flex-shrink:0}
#plusButton{width:42px;height:42px;border:1px solid #454650;border-radius:50%;background:#303139;color:white;font-size:27px;display:flex;align-items:center;justify-content:center}
#plusButton:hover{background:#41424b}
#plusMenu{position:absolute;bottom:52px;left:0;width:205px;background:#25262d;border:1px solid #41424b;border-radius:14px;padding:6px;box-shadow:0 10px 35px #0008;z-index:10}
#plusMenu[hidden]{display:none}
.tool-option{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:#f5f5f7;text-align:left;padding:12px;border-radius:9px;font-size:14px}
.tool-option:hover{background:#383941}
.tool-icon{font-size:20px;width:24px;text-align:center}
#status{font-size:12px;color:#aaa;text-align:center;padding-top:9px}
.result-image{display:block;max-width:min(100%,512px);height:auto;border-radius:12px;margin-top:10px}
.result-video{display:block;max-width:min(100%,640px);width:100%;border-radius:12px;margin-top:10px}
.media-result{width:100%;max-width:800px;margin:0 auto;line-height:1.5}
.media-result a{color:#9abaff}
#promptDialog{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
#promptDialog[hidden]{display:none}
.dialog-card{width:100%;max-width:440px;background:#202127;border:1px solid #41424b;border-radius:18px;padding:20px}
.dialog-card h2{font-size:19px;margin:0 0 8px}
.dialog-card p{font-size:13px;color:#b8b8c2;margin:0 0 14px}
#mediaPrompt{width:100%;min-height:110px;resize:vertical;background:#15161a;color:white;border:1px solid #41424b;border-radius:12px;padding:12px;outline:none}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.dialog-actions button{padding:10px 14px;border-radius:10px;border:1px solid #41424b}
#cancelPrompt{background:#303139;color:white}
#startMedia{background:#f5f5f7;color:#111;border-color:#f5f5f7}
#startMedia:disabled{opacity:.5}
@media(max-width:650px){
#sidebar{position:fixed;z-index:5;inset:0 auto 0 0;box-shadow:10px 0 40px #0008}
#sidebar.hidden{display:none}
#messages{padding:18px 12px}
.composer-wrap{padding:10px 10px 14px}
#composer{gap:6px;padding:8px}
#messageInput{padding:10px 5px;font-size:15px}
#plusButton,#sendButton{width:39px;height:39px}
}
</style>
</head>
<body>
<aside id="sidebar">
  <div class="side-top">
    <div class="brand">Onur AI</div>
    <button id="closeMenu" class="delete-chat" aria-label="Menüyü kapat">✕</button>
  </div>
  <button id="newChat">＋ Yeni sohbet</button>
  <div id="chatList"></div>
</aside>

<main id="main">
  <header>
    <button id="menuButton" aria-label="Menüyü aç">☰</button>
    <div id="mobileTitle">Onur AI</div>
  </header>

  <section id="messages"></section>

  <div class="composer-wrap">
    <form id="composer">
      <div id="plusWrap">
        <button id="plusButton" type="button" aria-label="Araçları aç" aria-expanded="false">+</button>
        <div id="plusMenu" hidden>
          <button class="tool-option" type="button" data-tool="image">
            <span class="tool-icon">🎨</span>
            <span>Görsel oluştur</span>
          </button>
          <button class="tool-option" type="button" data-tool="video">
            <span class="tool-icon">🎬</span>
            <span>Video oluştur</span>
          </button>
        </div>
      </div>
      <textarea id="messageInput" rows="1" placeholder="Onur AI'ye mesaj gönder..." required></textarea>
      <button id="sendButton" type="submit" aria-label="Gönder">↑</button>
    </form>
    <div id="status">Onur AI hata yapabilir. Önemli bilgileri kontrol et.</div>
  </div>
</main>

<div id="promptDialog" hidden>
  <div class="dialog-card">
    <h2 id="dialogTitle">Görsel oluştur</h2>
    <p id="dialogDescription">Oluşturmak istediğin şeyi tarif et.</p>
    <textarea id="mediaPrompt" placeholder="Örneğin: Gün batımında piksel sanatlı bir Minecraft köyü"></textarea>
    <div class="dialog-actions">
      <button id="cancelPrompt" type="button">İptal</button>
      <button id="startMedia" type="button">Oluştur</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = "onur_ai_chats_v1";
const ACTIVE_KEY = "onur_ai_active_v1";

const sidebar = document.getElementById("sidebar");
const chatList = document.getElementById("chatList");
const messages = document.getElementById("messages");
const composer = document.getElementById("composer");
const messageInput = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const statusText = document.getElementById("status");
const plusButton = document.getElementById("plusButton");
const plusMenu = document.getElementById("plusMenu");
const promptDialog = document.getElementById("promptDialog");
const dialogTitle = document.getElementById("dialogTitle");
const dialogDescription = document.getElementById("dialogDescription");
const mediaPrompt = document.getElementById("mediaPrompt");
const startMedia = document.getElementById("startMedia");

let chats = loadChats();
let activeId = localStorage.getItem(ACTIVE_KEY);
let busy = false;
let selectedTool = "image";

function makeId(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}

function loadChats(){
  try{
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    return Array.isArray(saved) ? saved : [];
  }catch{
    return [];
  }
}

function saveChats(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
  localStorage.setItem(ACTIVE_KEY, activeId || "");
}

function activeChat(){
  return chats.find(chat => chat.id === activeId);
}

function createChat(){
  const number = chats.reduce((max, chat) => Math.max(max, Number(chat.number) || 0), 0) + 1;
  const chat = {
    id: makeId(),
    number,
    title: "Sohbet " + number,
    messages: []
  };

  chats.unshift(chat);
  activeId = chat.id;
  saveChats();
  renderAll();

  if(window.innerWidth <= 650) sidebar.classList.add("hidden");
  messageInput.focus();
}

function renderChatList(){
  chatList.replaceChildren();

  chats.forEach(chat => {
    const row = document.createElement("div");
    row.className = "chat-item";

    const select = document.createElement("button");
    select.className = "chat-select" + (chat.id === activeId ? " active" : "");
    select.textContent = chat.title;
    select.onclick = () => {
      activeId = chat.id;
      saveChats();
      renderAll();
      if(window.innerWidth <= 650) sidebar.classList.add("hidden");
    };

    const remove = document.createElement("button");
    remove.className = "delete-chat";
    remove.textContent = "×";
    remove.title = "Sohbeti sil";
    remove.onclick = () => {
      chats = chats.filter(item => item.id !== chat.id);

      if(activeId === chat.id){
        activeId = chats[0]?.id || null;
      }

      if(!chats.length){
        createChat();
      }else{
        saveChats();
        renderAll();
      }
    };

    row.append(select, remove);
    chatList.append(row);
  });
}

function addMessage(role, text){
  const chat = activeChat();
  if(!chat) return;

  chat.messages.push({role, text});
  saveChats();
  renderMessages();
  renderChatList();
}

function addMediaMessage(kind, url, filename){
  const chat = activeChat();
  if(!chat) return;

  chat.messages.push({
    role: "assistant",
    text: kind === "image" ? "Görsel oluşturuldu." : "Video oluşturuldu.",
    media: {kind, url, filename}
  });

  saveChats();
  renderMessages();
  renderChatList();
}

function renderMessages(){
  messages.replaceChildren();
  const chat = activeChat();

  if(!chat || !chat.messages.length){
    const welcome = document.createElement("div");
    welcome.className = "welcome";

    const title = document.createElement("h1");
    title.textContent = "Nasıl yardımcı olabilirim?";

    const subtitle = document.createElement("p");
    subtitle.textContent = "Onur AI ile sohbete başla.";

    welcome.append(title, subtitle);
    messages.append(welcome);
    return;
  }

  chat.messages.forEach(item => {
    const element = document.createElement("div");
    element.className = "message " + (item.role === "user" ? "user" : "assistant");
    element.textContent = item.text;
    messages.append(element);

    if(item.media){
      const mediaBox = document.createElement("div");
      mediaBox.className = "media-result";

      if(item.media.kind === "image"){
        const img = document.createElement("img");
        img.className = "result-image";
        img.src = item.media.url;
        img.alt = "Onur AI tarafından oluşturulan görsel";
        mediaBox.append(img);
      }else{
        const video = document.createElement("video");
        video.className = "result-video";
        video.src = item.media.url;
        video.controls = true;
        video.playsInline = true;
        mediaBox.append(video);
      }

      const link = document.createElement("a");
      link.href = item.media.url;
      link.download = item.media.filename;
      link.textContent = item.media.kind === "image" ? "Görseli indir" : "Videoyu indir";
      link.style.display = "inline-block";
      link.style.marginTop = "10px";

      mediaBox.append(link);
      messages.append(mediaBox);
    }
  });

  messages.scrollTop = messages.scrollHeight;
}

function renderAll(){
  renderChatList();
  renderMessages();
}

async function sendMessage(text){
  const chat = activeChat();
  if(!chat || busy) return;

  const message = text.trim();
  if(!message) return;

  const history = chat.messages
    .filter(item => !item.media)
    .map(item => ({
      role: item.role === "assistant" ? "model" : "user",
      text: item.text
    }));

  if(chat.messages.length === 0){
    chat.title = message.length > 28 ? message.slice(0,28) + "…" : message;
  }

  addMessage("user", message);
  busy = true;
  sendButton.disabled = true;
  plusButton.disabled = true;
  statusText.textContent = "Onur AI düşünüyor…";

  try{
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({message, history})
    });

    const data = await response.json();

    if(!response.ok){
      throw new Error(data.error || "İstek başarısız oldu.");
    }

    addMessage("assistant", data.reply || "Cevap alınamadı.");
    statusText.textContent = "Onur AI";
  }catch(error){
    addMessage("assistant", "Hata: " + error.message);
    statusText.textContent = "Bağlantı hatası";
  }finally{
    busy = false;
    sendButton.disabled = false;
    plusButton.disabled = false;
    messageInput.focus();
  }
}

function openTool(tool){
  selectedTool = tool;
  plusMenu.hidden = true;
  plusButton.setAttribute("aria-expanded", "false");

  if(tool === "video"){
    dialogTitle.textContent = "🎬 Video oluştur";
    dialogDescription.textContent = "Oluşturmak istediğin animasyonu tarif et.";
    mediaPrompt.placeholder = "Örneğin: Gökyüzünde hareket eden bir roket animasyonu";
  }else{
    dialogTitle.textContent = "🎨 Görsel oluştur";
    dialogDescription.textContent = "Oluşturmak istediğin görseli tarif et.";
    mediaPrompt.placeholder = "Örneğin: Piksel sanatlı bir Minecraft köyü";
  }

  promptDialog.hidden = false;
  mediaPrompt.value = "";
  mediaPrompt.focus();
}

function closeTool(){
  promptDialog.hidden = true;
  startMedia.disabled = false;
  startMedia.textContent = "Oluştur";
}

async function generateMedia(){
  const prompt = mediaPrompt.value.trim();
  if(!prompt || busy) return;

  const chat = activeChat();
  if(!chat) return;

  const tool = selectedTool;
  const endpoint = tool === "video" ? "/api/video" : "/api/image";
  const mime = tool === "video" ? "video/mp4" : "image/png";
  const extension = tool === "video" ? "mp4" : "png";

  if(chat.messages.length === 0){
    chat.title = (tool === "video" ? "Video: " : "Görsel: ") +
      (prompt.length > 22 ? prompt.slice(0,22) + "…" : prompt);
  }

  addMessage("user", (tool === "video" ? "🎬 Video oluştur: " : "🎨 Görsel oluştur: ") + prompt);
  busy = true;
  sendButton.disabled = true;
  plusButton.disabled = true;
  startMedia.disabled = true;
  startMedia.textContent = "Oluşturuluyor…";
  statusText.textContent = tool === "video" ? "Video hazırlanıyor, lütfen bekle…" : "Görsel hazırlanıyor, lütfen bekle…";
  promptDialog.hidden = true;

  try{
    const response = await fetch(endpoint, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({prompt})
    });

    if(!response.ok){
      let errorMessage = "Medya oluşturulamadı.";
      try{
        const data = await response.json();
        errorMessage = data.error || errorMessage;
      }catch{}
      throw new Error(errorMessage);
    }

    const blob = await response.blob();

    if(!blob.size){
      throw new Error("Sunucu boş bir dosya döndürdü.");
    }

    const url = URL.createObjectURL(new Blob([blob], {type: blob.type || mime}));
    const filename = "onur-ai-" + Date.now() + "." + extension;

    addMediaMessage(tool, url, filename);
    statusText.textContent = tool === "video" ? "Video hazır." : "Görsel hazır.";
  }catch(error){
    addMessage("assistant", "Oluşturma hatası: " + error.message);
    statusText.textContent = "Oluşturma başarısız";
  }finally{
    busy = false;
    sendButton.disabled = false;
    plusButton.disabled = false;
    startMedia.disabled = false;
    startMedia.textContent = "Oluştur";
    messageInput.focus();
  }
}

composer.addEventListener("submit", async event => {
  event.preventDefault();
  const text = messageInput.value;
  if(!text.trim() || busy) return;

  messageInput.value = "";
  messageInput.style.height = "42px";
  await sendMessage(text);
});

messageInput.addEventListener("input", () => {
  messageInput.style.height = "42px";
  messageInput.style.height = Math.min(messageInput.scrollHeight, 180) + "px";
});

plusButton.addEventListener("click", () => {
  if(busy) return;

  plusMenu.hidden = !plusMenu.hidden;
  plusButton.setAttribute("aria-expanded", String(!plusMenu.hidden));
});

plusMenu.querySelectorAll("[data-tool]").forEach(button => {
  button.addEventListener("click", () => openTool(button.dataset.tool));
});

document.addEventListener("click", event => {
  if(!document.getElementById("plusWrap").contains(event.target)){
    plusMenu.hidden = true;
    plusButton.setAttribute("aria-expanded", "false");
  }
});

document.getElementById("cancelPrompt").onclick = closeTool;
startMedia.addEventListener("click", generateMedia);

promptDialog.addEventListener("click", event => {
  if(event.target === promptDialog) closeTool();
});

mediaPrompt.addEventListener("keydown", event => {
  if(event.key === "Enter" && !event.shiftKey){
    event.preventDefault();
    generateMedia();
  }
});

document.getElementById("newChat").onclick = createChat;
document.getElementById("menuButton").onclick = () => sidebar.classList.toggle("hidden");
document.getElementById("closeMenu").onclick = () => sidebar.classList.add("hidden");

if(!activeId || !chats.some(chat => chat.id === activeId)){
  if(chats.length){
    activeId = chats[0].id;
  }else{
    createChat();
  }
}

saveChats();
renderAll();
</script>
</body>
</html>
